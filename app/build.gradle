plugins { id 'com.android.application' }
android {
    namespace 'io.github.yomilens'
    compileSdk 36
    defaultConfig { applicationId 'io.github.yomilens'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']; merges += ['META-INF/CONTRIBUTORS.md','META-INF/LICENSE.md','META-INF/NOTICE.md'] } }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
