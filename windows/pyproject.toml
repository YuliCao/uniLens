[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yomilens-windows"
version = "0.1.0"
description = "Offline Japanese reading overlay for Windows"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.8.3", "rapidocr==3.9.2", "onnxruntime==1.30.0", "fugashi==1.5.2", "unidic-lite==1.0.8", "mss==10.2.0", "Pillow==12.3.0"]

[project.scripts]
yomilens = "yomilens_windows.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
